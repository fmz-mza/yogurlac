<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - YogurLac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/styles.css"> <style id="auth-oculto">body{visibility:hidden}</style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <script src="js/nav.js"></script>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Clientes</h2>
                <p class="text-gray-600 mt-1">Gestión de clientes y listas de precios</p>
         </div>
            <button id="btn-nuevo-cliente" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
    + Nuevo Cliente
            </button>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="search-cliente" placeholder="Buscar cliente..." 
                       class="flex-1 border border-gray-300 rounded-md px-3 py-2">
                <select id="filter-lista-precio" class="w-full sm:w-48 border border-gray-300 rounded-md px-3 py-2">
                    <option value="">Todas las listas</option>
                    <option value="minorista">Minorista</option>
                    <option value="mayorista">Mayorista</option>
                    <option value="distribuidor">Distribuidor</option>
                </select>
            </div>
        </div>

        <!-- Clients Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dirección</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lista de Precios</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Saldo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clientes-table" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
        <!-- MODAL NUEVO CLIENTE -->
<!-- MODAL CLIENTE (UNIFICADO: CREAR Y EDITAR) -->
<div id="modal-cliente" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative p-5 border w-96 shadow-lg rounded-md bg-white mx-auto">
        <div class="mt-3 text-center">
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Nuevo Cliente</h3>
            <form id="form-cliente" class="text-left space-y-4">
                <!-- INPUT OCULTO PARA ID (Clave para edición) -->
                <input type="hidden" id="cli-id-edit" value="">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre *</label>
                    <input type="text" id="cli-nombre" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Teléfono</label>
                    <input type="tel" id="cli-telefono" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Dirección</label>
                    <input type="text" id="cli-direccion" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Lista de Precios</label>
                    <select id="cli-lista" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                        <option value="minorista">Minorista</option>
                        <option value="mayorista">Mayorista</option>
                        <option value="distribuidor">Distribuidor</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" id="btn-cancelar-cli" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

        <!-- MODAL MOVIMIENTO CUENTA CORRIENTE -->
<div id="modal-movimiento" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative p-5 border w-96 shadow-lg rounded-md bg-white mx-auto">
        <div class="mt-3 text-center">
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-2">Registrar Movimiento</h3>
            <p id="mov-cliente-nombre" class="text-sm text-gray-500 mb-4 font-semibold"></p>
            
            <form id="form-movimiento" class="text-left space-y-4">
                <input type="hidden" id="mov-cliente-id">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tipo</label>
                    <select id="mov-tipo" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 bg-white">
                        <option value="pago">💰 Pago (Resta deuda)</option>
                        <option value="compra">🛒 Compra a Cuenta (Suma deuda)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Monto ($)</label>
                    <input type="number" step="0.01" id="mov-monto" required 
                           class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-lg font-bold">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Concepto / Nota</label>
                    <input type="text" id="mov-concepto" placeholder="Ej: Pago semanal, Yogures x12..." 
                           class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cerrarModalMovimiento()" 
                            class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancelar</button>
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
        <!-- MODAL HISTORIAL DE MOVIMIENTOS -->
<div id="modal-historial" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-start mb-4">
            <div>
                <h3 class="text-lg leading-6 font-medium text-gray-900">Historial de movimientos</h3>
                <p id="hist-cliente-nombre" class="text-sm text-gray-500 font-semibold"></p>
            </div>
            <button type="button" onclick="cerrarHistorial()" class="text-gray-500 hover:text-gray-800 text-xl leading-none" aria-label="Cerrar">&times;</button>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Tipo</th>
                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Concepto</th>
                        <th class="px-3 py-2 text-right text-xs font-medium text-gray-500 uppercase">Monto</th>
                        <th class="px-3 py-2 text-right text-xs font-medium text-gray-500 uppercase">Saldo</th>
                    </tr>
                </thead>
                <tbody id="hist-body" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
        <div class="flex justify-end mt-4">
            <button type="button" onclick="cerrarHistorial()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cerrar</button>
        </div>
    </div>
</div>
    </main>

    <script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
