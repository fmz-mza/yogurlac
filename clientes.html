<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - YogurLac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-blue-600">🥛 YogurLac</h1>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                    <a href="clientes.html" class="text-blue-600 font-semibold border-b-2 border-blue-600">Clientes</a>
                    <a href="precios.html" class="text-gray-700 hover:text-blue-600">Precios</a>
                    <a href="proveedores.html" class="text-gray-700 hover:text-blue-600">Proveedores</a>
                </div>
                <button id="mobile-menu-btn" class="md:hidden flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
            <a href="index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Dashboard</a>
            <a href="clientes.html" class="block px-4 py-2 text-blue-600 font-semibold bg-blue-50">Clientes</a>
            <a href="precios.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Precios</a>
            <a href="proveedores.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Proveedores</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Clientes</h2>
                <p class="text-gray-600 mt-1">Gestión de clientes y listas de precios</p>
            </div>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                + Nuevo Cliente
            </button>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="search-cliente" placeholder="Buscar cliente..." 
                       class="flex-1 border border-gray-300 rounded-md px-3 py-2">
                <select id="filter-lista-precio" class="w-full sm:w-48 border border-gray-300 rounded-md px-3 py-2">
                    <option value="">Todas las listas</option>
                    <option value="minorista">Minorista</option>
                    <option value="mayorista">Mayorista</option>
                    <option value="distribuidor">Distribuidor</option>
                </select>
            </div>
        </div>

        <!-- Clients Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dirección</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lista de Precios</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Saldo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="clientes-table" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
