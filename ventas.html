<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta - YogurLac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar Simplificado -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="text-xl font-bold text-blue-600"> YogurLac</a>
                <a href="index.html" class="text-sm text-gray-600 hover:text-blue-600">← Volver al Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Registrar Nueva Venta</h1>

        <!-- Paso 1: Selección de Cliente -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Seleccionar Cliente *</label>
            <select id="venta-cliente" class="w-full border border-gray-300 rounded-md px-3 py-2 bg-white">
                <option value="">-- Buscar cliente --</option>
            </select>
            <p id="cliente-info" class="mt-2 text-sm text-blue-600 hidden"></p>
        </div>

        <!-- Paso 2: Agregar Productos -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <div class="md:col-span-5">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
                    <select id="venta-producto" disabled class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100">
                        <option value="">Primero selecciona un cliente</option>
                    </select>
                </div>
                <div class="md:col-span-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                    <input type="number" id="venta-cantidad" min="1" value="1" disabled 
                           class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100">
                </div>
                <div class="md:col-span-4">
                    <button id="btn-agregar-item" disabled 
                            class="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        + Agregar
                    </button>
                </div>
            </div>
            <p id="precio-preview" class="mt-2 text-xs text-gray-500"></p>
        </div>

        <!-- Paso 3: Carrito / Detalle -->
        <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Producto</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cant.</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Precio Unit.</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subtotal</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acción</th>
                    </tr>
                </thead>
                <tbody id="carrito-body" class="bg-white divide-y divide-gray-200">
                    <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">El carrito está vacío</td></tr>
                </tbody>
                <tfoot class="bg-gray-50">
                    <tr>
                        <td colspan="3" class="px-6 py-4 text-right font-bold text-gray-900">TOTAL:</td>
                        <td id="carrito-total" class="px-6 py-4 font-bold text-xl text-blue-600">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Paso 4: Finalizar -->
        <div class="flex justify-end gap-4">
            <a href="index.html" class="px-6 py-3 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">Cancelar</a>
            <button id="btn-guardar-venta" disabled 
                    class="px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-bold disabled:opacity-50 disabled:cursor-not-allowed">
                💾 Guardar Venta
            </button>
        </div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/ventas.js"></script>
</body>
</html>
