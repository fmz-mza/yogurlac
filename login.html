<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - YogurLac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/styles.css"><style id="auth-oculto">body{visibility:hidden}</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-lg shadow w-full max-w-sm p-6">
        <h1 class="text-2xl font-bold text-blue-600 text-center">🥛 YogurLac</h1>
        <p class="text-gray-600 text-center mt-1 mb-6">Ingresá con tu cuenta</p>

        <form id="form-login" class="space-y-4">
            <div>
                <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="login-email" required autocomplete="username"
                       class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label for="login-password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="login-password" required autocomplete="current-password"
                       class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <p id="login-error" class="hidden text-sm text-red-600"></p>
            <button type="submit" id="btn-login"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition min-h-[44px]">
                Ingresar
            </button>
        </form>
    </div>

    <script src="js/supabase.js"></script><script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
