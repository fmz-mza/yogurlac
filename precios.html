<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precios - YogurLac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-blue-600">🥛 YogurLac</h1>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                    <a href="clientes.html" class="text-gray-700 hover:text-blue-600">Clientes</a>
                    <a href="precios.html" class="text-blue-600 font-semibold border-b-2 border-blue-600">Precios</a>
                    <a href="proveedores.html" class="text-gray-700 hover:text-blue-600">Proveedores</a>
                </div>
                <button id="mobile-menu-btn" class="md:hidden flex items-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
            <a href="index.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Dashboard</a>
            <a href="clientes.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Clientes</a>
            <a href="precios.html" class="block px-4 py-2 text-blue-600 font-semibold bg-blue-50">Precios</a>
            <a href="proveedores.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50">Proveedores</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Precios de Productos</h2>
                <p class="text-gray-600 mt-1">Gestión de costos y precios de venta</p>
            </div>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition" id="btn-nuevo-producto">
                + Nuevo Producto
            </button>
        </div>

        <!-- Products Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Producto</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoría</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Costo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Precio Venta</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Margen</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productos-table" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Botón con ID para conectar JS -->
<button id="btn-nuevo-producto" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
    + Nuevo Producto
</button>

<!-- ... resto del contenido ... -->

<!-- MODAL NUEVO PRODUCTO (Agregar antes de </main>) -->
<div id="modal-producto" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <h3 class="text-lg leading-6 font-medium text-gray-900">Nuevo Producto</h3>
            <form id="form-producto" class="mt-2 text-left space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre</label>
                    <input type="text" id="prod-nombre" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Categoría</label>
                    <input type="text" id="prod-categoria" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Costo</label>
                        <input type="number" step="0.01" id="prod-costo" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Precio Venta</label>
                        <input type="number" step="0.01" id="prod-precio" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" id="btn-cancelar" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
    </main>

    <script src="js/supabase.js"></script>
    <script src="js/precios.js"></script>
</body>
</html>
