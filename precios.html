<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precios - YogurLac</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="css/styles.css"> <style id="auth-oculto">body{visibility:hidden}</style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <script src="js/nav.js"></script>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Precios de Productos</h2>
                <p class="text-gray-600 mt-1">Gestión de costos y precios de venta</p>
            </div>
            <button id="btn-nuevo-producto" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                + Nuevo Producto
            </button>
        </div>

        <!-- TABLA DE PRECIOS EDITABLE (CORRECTAMENTE UBICADA FUERA DEL MODAL) -->
        <div class="bg-white rounded-lg shadow overflow-hidden mb-8">
            <div class="p-4 border-b flex flex-col sm:flex-row justify-between items-center gap-3">
                <h3 class="text-lg font-semibold text-gray-900">Lista de Precios</h3>
                <div class="flex gap-2 w-full sm:w-auto">
                    <input type="text" id="filtro-producto" placeholder="Buscar producto..." 
                           class="border border-gray-300 rounded-md px-3 py-2 text-sm w-full sm:w-48 focus:ring-2 focus:ring-blue-500 outline-none">
                    <select id="filtro-categoria" class="border border-gray-300 rounded-md px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
            </div>
            
            <div class="overflow-x-auto -mx-4 sm:mx-0">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
    <tr>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider min-w-[150px]">Producto</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Costo Base</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-green-700 uppercase tracking-wider">P. Minorista</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-blue-700 uppercase tracking-wider">P. Mayorista</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-purple-700 uppercase tracking-wider">P. Distribuidor</th>
        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-[160px]">Acciones</th>
    </tr>
</thead>
                    <tbody id="tabla-precios-body" class="bg-white divide-y divide-gray-200">
                        <!-- Se genera dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODAL NUEVO PRODUCTO (SOLO FORMULARIO, SIN TABLA) -->
        <div id="modal-producto" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
            <div class="relative p-5 border w-[500px] shadow-lg rounded-md bg-white mx-auto max-h-[90vh] overflow-y-auto">
                <div class="mt-3 text-center">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Nuevo Producto</h3>
                    <form id="form-producto" class="text-left space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nombre *</label>
                                <input type="text" id="prod-nombre" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Categoría</label>
                                <input type="text" id="prod-categoria" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Costo Base *</label>
                                <input type="number" step="0.01" id="prod-costo" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Precio Venta Base *</label>
                                <input type="number" step="0.01" min="0" id="prod-precio" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
                            </div>
                        </div>

                        <div class="border-t pt-4 mt-4">
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Listas de Precios Específicas</p>
                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-green-700">Minorista</label>
                                    <input type="number" step="0.01" id="prod-p-minorista" placeholder="Opcional" class="mt-1 block w-full border border-gray-300 rounded-md px-2 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-blue-700">Mayorista</label>
                                    <input type="number" step="0.01" id="prod-p-mayorista" placeholder="Opcional" class="mt-1 block w-full border border-gray-300 rounded-md px-2 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-purple-700">Distribuidor</label>
                                    <input type="number" step="0.01" id="prod-p-distribuidor" placeholder="Opcional" class="mt-1 block w-full border border-gray-300 rounded-md px-2 py-2 text-sm">
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end gap-2 mt-6 pt-4 border-t">
                            <button type="button" id="btn-cancelar" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script>
    <script src="js/precios.js"></script>
</body>
</html>
